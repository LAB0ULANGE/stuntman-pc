# Stuntman PC port - settings (see README.txt). The game reads this file when
# it starts; the first start adds the line disc= (your disc image) below.

# The picture.
resolution=2x
fullscreen=on
widescreen=on
aspect=16:9
antialiasing=fxaa
sharpen=25

# The port's speed and smoothness settings: leave them as they are.
barriers=precise
vu_fast=on
render_queue_frames=2
gpu_ring=4
deinterlace=auto
display_reload=on
blank_wake=on
texture_reuse=on
